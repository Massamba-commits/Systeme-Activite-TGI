<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion | TGI</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 40px;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.login-box h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #203a43;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.login-box button {
    width: 100%;
    padding: 12px;
    background: #2c5364;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}

.login-box button:hover {
    background: #0d2299;
}

.register {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
}

.register a {
    color: #0812a0;
    font-weight: bold;
    text-decoration: none;
}

.register a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Connexion</h2>

    <!-- FORMULAIRE DE CONNEXION -->
    <form action="dashboard.html" method="get">
        <input type="text" name="prenom" placeholder="Prénom" required>
        <input type="text" name="nom" placeholder="Nom" required>
        <input type="email" name="email" placeholder="Adresse email" required>
        <input type="password" placeholder="Mot de passe" required>

        <button type="submit">Se connecter</button>
    </form>

    <!-- OPTION CREER UN COMPTE -->
    <div class="register">
        Nouveau sur la plateforme ?
        <a href="register.html">Créer un compte</a>
    </div>
</div>

</body>
</html>
