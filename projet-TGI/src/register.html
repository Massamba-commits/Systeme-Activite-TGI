<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Créer un compte | TGI</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.register-box {
    background: white;
    padding: 40px;
    width: 420px;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.register-box h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #0a4193;
}

.register-box input,
.register-box select {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.register-box button {
    width: 100%;
    padding: 12px;
    background: #0d45c7;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}

.register-box button:hover {
    background: #203a43;
}

.link {
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="register-box">
    <h2>Créer un compte</h2>

    <!-- APRES INSCRIPTION → DASHBOARD -->
    <form action="dashboard.html" method="get">
        <input type="text" name="prenom" placeholder="Prénom" required>
        <input type="text" name="nom" placeholder="Nom" required>

        <select name="statut" required>
            <option value="">Statut</option>
            <option value="Employé">Employé</option>
            <option value="Étudiant">Étudiant</option>
        </select>

        <input type="email" name="email" placeholder="Adresse email" required>
        <input type="password" placeholder="Mot de passe" required>

        <button type="submit">Créer le compte</button>
    </form>

    <div class="link">
        Déjà inscrit ? <a href="login.html">Se connecter</a>
    </div>
</div>

</body>
</html>
