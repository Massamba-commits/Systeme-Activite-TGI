<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Annulé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }
        .cancel-icon {
            width: 80px;
            height: 80px;
            background: #ff9800;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
            margin: 0 10px;
        }
        .button:hover {
            background: #764ba2;
        }
        .button-secondary {
            background: #999;
        }
        .button-secondary:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cancel-icon">✕</div>
        <h1>Paiement Annulé</h1>
        <p>Votre transaction a été annulée. Aucune charge n'a été effectuée sur votre compte.</p>
        <p><strong>Raison:</strong> <span id="reason">Annulation par l'utilisateur</span></p>
        <div>
            <a href="/" class="button">Retour à l'accueil</a>
            <a href="/" class="button button-secondary">Contacter le support</a>
        </div>
    </div>
    <script>
        // Récupérer la raison depuis l'URL si disponible
        const params = new URLSearchParams(window.location.search);
        const reason = params.get('reason') || 'Annulation par l\'utilisateur';
        document.getElementById('reason').textContent = reason;
    </script>
</body>
</html>
